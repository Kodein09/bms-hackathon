<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BMS Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>:root,[data-theme="dark"]{--bg:#0c0c0e;--card:#16161a;--border:#2a2a32;--text:#e4e4e7;--muted:#a1a1aa;--header:rgba(12,12,14,.9);--input:#1c1c22}[data-theme="light"]{--bg:#f4f4f5;--card:#fff;--border:#e4e4e7;--text:#18181b;--muted:#71717a;--header:rgba(244,244,245,.95);--input:#f4f4f5}body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif}input{background:var(--input);border:1px solid var(--border);color:var(--text)}</style>
</head>
<body class="min-h-screen"><header class="sticky top-0 z-10 border-b border-[var(--border)] bg-[var(--header)] px-4 backdrop-blur-md"><div class="mx-auto flex h-14 max-w-7xl items-center justify-between"><a href="index.html" class="flex items-center gap-2"><span class="grid h-8 w-8 place-items-center rounded-full bg-lime-500 font-bold text-black">T</span><span class="font-semibold">BMS <span class="font-normal text-[var(--muted)]">Tracker</span></span></a><nav class="hidden gap-1 text-sm md:flex"><a class="rounded-lg px-3 py-2 text-[var(--muted)] hover:bg-white/5" href="index.html">Главная</a><a class="rounded-lg px-3 py-2 text-[var(--muted)] hover:bg-white/5" href="academy.html">Academy</a><a class="rounded-lg bg-white/10 px-3 py-2" href="tracker.html">Tracker</a></nav><button data-theme-toggle class="p-2 text-[var(--muted)]" title="Сменить тему">◐</button></div></header>
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6"><div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><p class="text-sm text-lime-400">Фокус и время</p><h1 class="mt-1 text-3xl font-semibold">Tracker</h1><p class="mt-2 text-[var(--muted)]">Планируй задачи, запускай фокус и видь результат дня.</p></div><div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-5 text-center"><p class="text-xs uppercase text-[var(--muted)]">Фокус сегодня</p><p id="total-time" class="mt-1 text-3xl font-semibold">00:00:00</p></div></div><section class="grid gap-6 lg:grid-cols-[1fr_340px]"><div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-5"><div class="mb-5 flex gap-2"><input id="task-input" class="min-w-0 flex-1 rounded-xl px-4 py-3 text-sm" placeholder="Добавить задачу..."/><button id="add-task" class="rounded-xl bg-lime-600 px-4 py-3 text-sm font-medium text-white hover:bg-lime-500">Добавить</button></div><div id="task-list" class="space-y-2"></div></div><aside class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-6"><p class="text-xs uppercase text-[var(--muted)]">Текущая задача</p><h2 id="active-task" class="mt-3 min-h-14 text-lg font-semibold">Выбери задачу</h2><p id="timer" class="my-6 text-center text-5xl font-semibold tabular-nums">00:00</p><button id="timer-button" class="w-full rounded-xl bg-lime-600 px-4 py-3 font-medium text-white hover:bg-lime-500">Старт</button></aside></section></main>
  <script src="js/theme.js"></script><script>
    const key='bms-tracker-tasks';let tasks=JSON.parse(localStorage.getItem(key)||'[]'),activeId=null,startedAt=null,elapsed=0,interval=null;
    function save(){localStorage.setItem(key,JSON.stringify(tasks))}function format(seconds){const h=String(Math.floor(seconds/3600)).padStart(2,'0'),m=String(Math.floor(seconds%3600/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');return `${h}:${m}:${s}`}function render(){document.querySelector('#task-list').innerHTML=tasks.length?tasks.map(task=>`<div class="flex items-center gap-3 rounded-xl border border-[var(--border)] p-3"><button data-select="${task.id}" class="min-w-0 flex-1 text-left ${task.done?'line-through text-[var(--muted)]':''}">${task.title}</button><button data-done="${task.id}" class="text-xs text-lime-400">${task.done?'Вернуть':'Готово'}</button><button data-remove="${task.id}" class="text-xs text-red-400">Удалить</button></div>`).join(''):'<p class="py-8 text-center text-sm text-[var(--muted)]">Задач пока нет.</p>';document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>select(b.dataset.select));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>x.id===b.dataset.done);t.done=!t.done;save();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{tasks=tasks.filter(x=>x.id!==b.dataset.remove);if(activeId===b.dataset.remove)stop();save();render()});const total=tasks.reduce((sum,t)=>sum+(t.seconds||0),0);document.querySelector('#total-time').textContent=format(total)}function select(id){activeId=id;const task=tasks.find(x=>x.id===id);document.querySelector('#active-task').textContent=task.title;document.querySelector('#timer').textContent=format(task.seconds||0).slice(3);document.querySelector('#timer-button').textContent='Старт'}function stop(){if(interval)clearInterval(interval);interval=null;startedAt=null;document.querySelector('#timer-button').textContent='Старт'}function tick(){const task=tasks.find(x=>x.id===activeId);if(!task)return;task.seconds=(task.seconds||0)+1;document.querySelector('#timer').textContent=format(task.seconds).slice(3);document.querySelector('#total-time').textContent=format(tasks.reduce((sum,t)=>sum+(t.seconds||0),0));save()}document.querySelector('#add-task').onclick=()=>{const input=document.querySelector('#task-input'),title=input.value.trim();if(!title)return;tasks.push({id:crypto.randomUUID(),title,done:false,seconds:0});input.value='';save();render()};document.querySelector('#task-input').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#add-task').click()};document.querySelector('#timer-button').onclick=()=>{if(!activeId)return; if(interval){stop()}else{interval=setInterval(tick,1000);document.querySelector('#timer-button').textContent='Пауза'}};render();
  </script>
</body>
</html>
